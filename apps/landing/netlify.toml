[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/app"
  to = "https://invomir.com/app/dashboard"
  status = 301

[[redirects]]
  from = "/login"
  to = "https://invomir.com/auth/login"
  status = 301

[[redirects]]
  from = "/register"
  to = "https://invomir.com/auth/register"
  status = 301

