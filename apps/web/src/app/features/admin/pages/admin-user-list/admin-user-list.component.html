<section class="mx-auto max-w-7xl p-6 lg:p-8">
  <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
    <div>
      <p class="text-xs font-medium uppercase tracking-normal text-neutral-500">System admin</p>
      <h1 class="mt-2 text-2xl font-semibold tracking-tight text-neutral-900">Admin users</h1>
      <p class="mt-2 text-sm text-neutral-500">
        Review workspace owners, access roles, plan state, and system-level account health.
      </p>
    </div>

    <button
      mat-stroked-button
      type="button"
      [disabled]="adminUserStore.isLoading()"
      (click)="refresh()"
    >
      <svg lucideRefreshCcw class="size-4" aria-hidden="true"></svg>
      Refresh
    </button>
  </div>

  @if (adminUserStore.errorMessages().length > 0) {
    <div class="mt-6 rounded-2xl border border-red-200 bg-red-50 p-5 shadow-sm">
      <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
        <div>
          <p class="text-sm font-medium text-red-800">Admin users could not be loaded</p>
          <div class="mt-2 space-y-1">
            @for (error of adminUserStore.errorMessages(); track error) {
              <p class="text-xs text-red-600">{{ error }}</p>
            }
          </div>
        </div>

        <button
          mat-button
          type="button"
          [disabled]="adminUserStore.isLoading()"
          (click)="refresh()"
        >
          Retry
        </button>
      </div>
    </div>
  }

  <div class="mt-6 flex flex-col gap-6">
    <app-admin-user-filters
      [filters]="adminUserStore.filters()"
      [isLoading]="adminUserStore.isLoading()"
      (filtersChange)="applyFilters($event)"
      (resetRequested)="resetFilters()"
    />

    <app-admin-user-table
      [rows]="adminUserStore.rows()"
      [isLoading]="adminUserStore.isLoading()"
      [currentPage]="adminUserStore.pageInfo().page"
      [pageSize]="adminUserStore.pageInfo().pageSize"
      [totalPages]="adminUserStore.pageInfo().totalPages"
      [totalCount]="adminUserStore.pageInfo().totalCount"
      [canManage]="canManageUsers()"
      (pageRequested)="changePage($event)"
      (pageSizeRequested)="changePageSize($event)"
    />
  </div>
</section>
