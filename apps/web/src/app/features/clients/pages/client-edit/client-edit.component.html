<section class="mx-auto max-w-7xl p-6 lg:p-8">
  <header class="flex items-center gap-3">
    <a
      routerLink="/app/clients"
      aria-label="Back to clients"
      title="Back to clients"
      class="inline-flex size-9 shrink-0 items-center justify-center rounded-lg border border-neutral-200 bg-white text-neutral-500 transition hover:border-neutral-300 hover:text-neutral-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
    >
      <svg lucideArrowLeft class="size-4" aria-hidden="true"></svg>
    </a>

    <div class="min-w-0">
      <h1 class="truncate text-2xl font-semibold tracking-tight text-neutral-900">
        Edit {{ client()?.name ?? 'client' }}
      </h1>
      <nav aria-label="Breadcrumb" class="mt-1 flex min-w-0 items-center gap-1 text-xs text-neutral-500">
        <a routerLink="/app/clients" class="transition hover:text-neutral-900">Clients</a>
        <span aria-hidden="true">/</span>
        <span class="truncate">Edit {{ client()?.name ?? 'client' }}</span>
      </nav>
    </div>
  </header>

  <app-client-form
    mode="edit"
    [client]="client()"
    [isLoading]="isLoading()"
    [isSubmitting]="isSubmitting()"
    [errorMessages]="errorMessages()"
    (saveRequested)="saveClient($event)"
  />
</section>
