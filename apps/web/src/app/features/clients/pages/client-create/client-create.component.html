<section class="mx-auto max-w-7xl p-6 lg:p-8">
  <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
    <div>
      <a
        routerLink="/app/clients"
        class="inline-flex items-center text-sm font-medium text-neutral-500 transition hover:text-neutral-900"
      >
        <svg lucideArrowLeft class="mr-2 size-4" aria-hidden="true"></svg>
        Clients
      </a>
      <p class="mt-4 text-xs font-medium uppercase tracking-normal text-neutral-500">
        Client editor
      </p>
      <h1 class="mt-2 text-2xl font-semibold tracking-tight text-neutral-900">New client</h1>
      <p class="mt-2 text-sm text-neutral-500">
        Create a billing profile for invoices and payment history.
      </p>
    </div>
  </div>

  <app-client-form
    mode="create"
    [isSubmitting]="isSubmitting()"
    [errorMessages]="errorMessages()"
    (saveRequested)="saveClient($event)"
  />
</section>
