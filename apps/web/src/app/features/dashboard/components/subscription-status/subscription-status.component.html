<article class="rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm">
  <div>
    <h2 class="text-lg font-semibold text-neutral-900">Workspace</h2>
    <p class="mt-1 text-sm text-neutral-500">{{ summary().email }}</p>
  </div>

  <div class="mt-6 space-y-4">
    <div class="rounded-xl bg-neutral-50 px-4 py-3">
      <p class="text-xs font-medium text-neutral-500">Plan</p>
      <p class="mt-1 text-sm font-semibold text-neutral-900">{{ summary().plan }}</p>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="rounded-xl bg-neutral-50 px-4 py-3">
        <p class="text-xs font-medium text-neutral-500">Role</p>
        <p class="mt-1 text-sm font-semibold text-neutral-900">{{ summary().role }}</p>
      </div>

      <div class="rounded-xl bg-neutral-50 px-4 py-3">
        <p class="text-xs font-medium text-neutral-500">Trial</p>
        <p class="mt-1 text-sm font-semibold text-neutral-900">{{ summary().trialLabel }}</p>
      </div>
    </div>
  </div>

  @if (summary().accessBadges.length > 0) {
    <div class="mt-6">
      <p class="text-xs font-medium text-neutral-500">Access</p>
      <div class="mt-3 flex flex-wrap gap-2">
        @for (badge of summary().accessBadges; track badge.id) {
          <span class="rounded-xl bg-primary/10 px-2 py-1 text-xs font-medium text-primary">{{
            badge.label
          }}</span>
        }
      </div>
    </div>
  }
</article>
