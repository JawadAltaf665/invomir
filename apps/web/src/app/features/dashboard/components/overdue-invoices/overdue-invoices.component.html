<article class="rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h2 class="text-lg font-semibold text-neutral-900">Collection risk</h2>
      <p class="mt-1 text-sm text-neutral-500">{{ summary().openInvoiceCount }} open invoices</p>
    </div>

    <span [class]="badgeClass()">{{ summary().overduePercentage }}%</span>
  </div>

  <div class="mt-8 space-y-4">
    <div>
      <div class="flex items-center justify-between gap-4">
        <span class="text-sm text-neutral-500">Overdue</span>
        <span class="text-sm font-semibold text-neutral-900">{{ summary().overdueDisplay }}</span>
      </div>
      <div class="mt-2 h-2 overflow-hidden rounded-xl bg-neutral-100">
        <div [class]="progressClass()" [style.width.%]="summary().overduePercentage"></div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="rounded-xl bg-neutral-50 px-4 py-3">
        <p class="text-xs font-medium text-neutral-500">Outstanding</p>
        <p class="mt-1 text-sm font-semibold text-neutral-900">
          {{ summary().outstandingDisplay }}
        </p>
      </div>

      <div class="rounded-xl bg-neutral-50 px-4 py-3">
        <p class="text-xs font-medium text-neutral-500">Past due</p>
        <p class="mt-1 text-sm font-semibold text-neutral-900">{{ summary().overdueCount }}</p>
      </div>
    </div>
  </div>
</article>
