<article class="flex h-full flex-col rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h2 class="text-lg font-semibold text-neutral-900">Invoice analytics</h2>
      <p class="mt-1 text-sm text-neutral-500">{{ totalCount() }} total invoices</p>
    </div>
  </div>

  @if (totalCount() > 0) {
    <div class="mt-6 space-y-4">
      @for (metric of displayMetrics(); track metric.id) {
        <div class="space-y-2">
          <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-2">
              <span [class]="metric.badgeClass">{{ metric.label }}</span>
            </div>
            <span class="text-sm font-medium text-neutral-900">{{ metric.count }}</span>
          </div>

          <div class="h-2 overflow-hidden rounded-xl bg-neutral-100">
            <div [class]="metric.barClass" [style.width.%]="metric.percentage"></div>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="flex flex-1 flex-col items-center justify-center py-16 text-center">
      <h3 class="text-base font-semibold text-neutral-900">No invoice activity yet</h3>
      <p class="mt-2 max-w-sm text-sm text-neutral-500">
        Invoice status analytics will appear after invoices exist.
      </p>
    </div>
  }
</article>
