<article
  class="rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm transition hover:shadow-md"
>
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0 space-y-2">
      <p class="text-sm font-medium text-neutral-500">{{ card().label }}</p>
      <p class="truncate text-2xl font-semibold tracking-tight text-neutral-900">
        {{ card().value }}
      </p>
    </div>

    <span [class]="toneClass()" aria-hidden="true"></span>
  </div>

  <p class="mt-4 text-xs text-neutral-500">{{ card().helper }}</p>
</article>
