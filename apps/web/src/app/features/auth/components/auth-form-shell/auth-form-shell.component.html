<article class="w-full max-w-md rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm">
  <div class="space-y-2">
    <p class="text-xs font-medium uppercase tracking-normal text-primary">InvoMir</p>
    <h1 class="text-2xl font-semibold tracking-tight text-neutral-900">{{ title() }}</h1>
    <p class="text-sm leading-6 text-neutral-500">{{ subtitle() }}</p>
  </div>

  <div class="mt-8">
    <ng-content />
  </div>

  @if (footerLabel() && footerLinkText() && footerLink()) {
    <p class="mt-6 text-center text-sm text-neutral-500">
      {{ footerLabel() }}
      <a [routerLink]="footerLink()" class="font-medium text-primary transition hover:text-primary/90">
        {{ footerLinkText() }}
      </a>
    </p>
  }
</article>
