<article class="h-full rounded-2xl border border-neutral-200 bg-white p-5 shadow-sm">
  @if (isLoading()) {
    <div class="h-5 w-32 animate-pulse rounded-xl bg-neutral-100"></div>
    <div class="mt-6 space-y-4">
      <div class="h-24 animate-pulse rounded-xl bg-neutral-100"></div>
      <div class="h-24 animate-pulse rounded-xl bg-neutral-100"></div>
    </div>
  } @else {
    <div class="flex items-start gap-4">
      <div class="grid size-11 shrink-0 place-items-center rounded-2xl bg-primary/10 text-primary">
        <svg lucideGauge class="size-5" aria-hidden="true"></svg>
      </div>
      <div>
        <h2 class="text-lg font-semibold text-neutral-900">Usage</h2>
        <p class="mt-1 text-sm text-neutral-500">Live plan limits from your current workspace.</p>
      </div>
    </div>

    <div class="mt-6 space-y-5">
      @for (metric of metrics(); track metric.id) {
        <div class="rounded-2xl bg-neutral-50 p-4">
          <div class="flex items-start justify-between gap-4">
            <div>
              <p class="text-sm font-medium text-neutral-900">{{ metric.label }}</p>
              <p class="mt-1 text-xs text-neutral-500">{{ metric.helper }}</p>
            </div>
            <p class="text-sm font-semibold text-neutral-900">
              {{ metric.usedDisplay }}
              <span class="font-normal text-neutral-500">/ {{ metric.limitDisplay }}</span>
            </p>
          </div>

          @if (metric.limitDisplay !== 'Unlimited') {
            <div class="mt-4 h-2 overflow-hidden rounded-xl bg-neutral-200">
              <div
                class="h-full rounded-xl transition-all duration-200"
                [class.bg-primary]="metric.tone === 'neutral'"
                [class.bg-amber-500]="metric.tone === 'warning'"
                [class.bg-red-500]="metric.tone === 'danger'"
                [style.width.%]="metric.percentage"
              ></div>
            </div>
          } @else {
            <div
              class="mt-4 inline-flex rounded-xl bg-white px-3 py-1 text-xs font-medium text-neutral-600"
            >
              Unlimited
            </div>
          }
        </div>
      }
    </div>
  }
</article>
