<div class="min-h-dvh bg-neutral-50 text-neutral-900">
  <header class="h-16 border-b border-neutral-200 bg-white">
    <div class="mx-auto flex h-full max-w-7xl items-center justify-between px-6 lg:px-8">
      <div class="flex items-center gap-6">
        <a routerLink="/app/dashboard" class="flex items-center gap-3">
          <span class="grid size-9 place-items-center rounded-xl bg-primary text-xs font-semibold text-white">
            IM
          </span>
          <span class="text-sm font-semibold text-neutral-900">InvoMir</span>
        </a>

        <nav class="hidden items-center gap-2 md:flex">
          <a
            routerLink="/app/dashboard"
            routerLinkActive="bg-primary/10 text-primary"
            class="rounded-xl px-3 py-2 text-sm font-medium text-neutral-600 transition hover:bg-neutral-100"
          >
            Dashboard
          </a>
        </nav>
      </div>

      <div class="flex items-center gap-4">
        <div class="hidden text-right sm:block">
          <p class="text-sm font-medium text-neutral-900">{{ authSession.user()?.firstName }}</p>
          <p class="text-xs text-neutral-500">{{ authSession.role() }}</p>
        </div>
        <button mat-stroked-button type="button" [disabled]="isLoggingOut()" (click)="logout()">
          Sign out
        </button>
      </div>
    </div>
  </header>

  <router-outlet />
</div>
